name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - staging
  pull_request:
    branches: ["*"]

# Permite que um job use o token de outro, necessário para o OIDC
permissions:
  contents: read
  id-token: write

jobs:
  # Job de testes permanece o mesmo
  testes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout de código
        uses: actions/checkout@v4

      - name: Configuração do JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Permissão de Executável ao Maven
        run: chmod +x ./mvnw

      - name: Executar Testes e Build
        run: ./mvnw clean verify

  # Job de build consolidado e refatorado
  build-and-push-to-gcr:
    needs: testes
    # Executa para qualquer uma das três branches
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout de código
        uses: actions/checkout@v4

      # Autentica no Google Cloud para poder interagir com o Artifact Registry
      - name: Autenticar no Google Cloud
        uses: google-github-actions/auth@v2
        with:
          # Usa o segredo de staging para as branches develop e staging
          credentials_json: ${{ (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/staging') && secrets.GCP_SA_KEY_STAGING || secrets.GCP_SA_KEY_PRODUCTION }}

      # Configura o Docker para se autenticar no Artifact Registry usando as credenciais do gcloud
      - name: Configurar Docker para o Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev

      # Determina a tag da imagem dinamicamente com base na branch
      - name: Determinar Tag da Imagem
        id: image_tag
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Build e Push para o Artifact Registry
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Monta o nome completo da imagem no formato do Artifact Registry
          tags: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/npvet-repo/npvet-backend-cloud:${{ steps.image_tag.outputs.tag }}

  # Jobs de deploy permanecem os mesmos, mas agora dependem do novo job de build
  deploy-to-staging:
    needs: build-and-push-to-gcr
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - name: Configurar gcloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_STAGING }}

      - name: Configurar kubectl
        run: |
          gcloud container clusters get-credentials npvet-cluster \
            --zone=us-central1-a \
            --project=${{ secrets.GCP_PROJECT_ID_STAGING }}

      - name: Reiniciar o deployment
        run: kubectl -n npvet-staging rollout restart deployment npvet-backend-deployment

  deploy-to-production:
    needs: build-and-push-to-gcr
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Configurar gcloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_PRODUCTION }}

      - name: Configurar kubectl
        run: |
          gcloud container clusters get-credentials npvet-cluster \
            --zone=us-central1-a \
            --project=${{ secrets.GCP_PROJECT_ID_PRODUCTION }}

      - name: Reiniciar o deployment
        run: kubectl -n npvet-prod rollout restart deployment npvet-backend-deployment