name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
      - staging
  pull_request:
    branches: ["*"]

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout de código
        uses: actions/checkout@v3

      - name: Configuração do JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Permissão de Executável ao Maven
        run: chmod +x ./mvnw

      - name: Executar Testes e Build
        run: ./mvnw clean verify

  build-and-push-develop:
    needs: testes
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout de código
        uses: actions/checkout@v3

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e Push da imagem Docker
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/npvet-backend-cloud:develop

  build-and-push-staging:
    needs: testes
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout de código
        uses: actions/checkout@v3

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e Push da imagem Docker
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/npvet-backend-cloud:staging

  build-and-push-main:
    needs: testes
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout de código
        uses: actions/checkout@v3

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e Push da imagem Docker
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/npvet-backend-cloud:latest

  deploy-to-staging:
    needs: build-and-push-staging
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Configurar gcloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_STAGING }}

      - name: Configurar kubectl
        uses: google-github-actions/get-gke-credentials@v1
        with:
          cluster_name: npvet-cluster
          location: us-central1  # ou zona do seu cluster
          project_id: ${{ secrets.GCP_PROJECT_ID_STAGING }}

      - name: Reiniciar o deployment
        run: |
          kubectl -n npvet-staging rollout restart deployment npvet-backend-deployment

  deploy-to-production:
    needs: build-and-push-main
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Configurar gcloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_PRODUCTION }}

      - name: Configurar kubectl
        uses: google-github-actions/get-gke-credentials@v1
        with:
          cluster_name: npvet-cluster
          location: us-central1  # ou zona do seu cluster
          project_id: ${{ secrets.GPC_PROJECT_ID_PRODUCTION }}

      - name: Reiniciar o deployment
        run: |
          kubectl -n npvet-prod rollout restart deployment npvet-backend-deployment